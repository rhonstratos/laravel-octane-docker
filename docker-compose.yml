volumes:
  mysql_data:
  redis_data:

services:
  web:
    image: 'nginx:1.30.1-alphine-slim'
    container_name: nginx_container
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    depends_on:
      - frankenphp

  mysql:
    image: "mysql:8.4"
    container_name: mysql_container
    restart: always
    environment: 
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: root
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
  redis:
    image: "redis:7.2-alpine"
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

      
  frankenphp:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    entrypoint: php artisan octane:frankenphp --workers=1 --max-requests=1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/vendor
      - /app/node_modules
    environment:
    - APP_ENV=local
    - APP_DEBUG=true
    - APP_LOG_LEVEL=debug