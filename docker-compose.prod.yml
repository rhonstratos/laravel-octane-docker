# Production-ready Laravel 12+ + Octane Docker Compose
# Services: FrankenPHP (Octane app), MySQL, Redis
name: laravel-api
services:
  frankenphp:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod
    image: laravel-api-app
    container_name: laravel_api_prod
    restart: always
    ports:
      - "80:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: false
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      CADDY_FILE: /etc/caddy/Caddyfile
      #LOG_CHANNEL: stderr
      # NOTE: In actual production, pass APP_KEY and passwords via GitHub Secrets, not hardcoded!
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    command: octane:frankenphp --host=0.0.0.0 --port=80 --max-requests=1000 --workers=auto
    healthcheck:
      test: ["CMD", "php", "artisan", "octane:status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  queue-worker:
    image: laravel-api-app
    entrypoint: ["php", "artisan"]
    container_name: queue_worker_prod
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: false
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    command: queue:work redis --sleep=3 --tries=3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  scheduler:
    image: laravel-api-app
    entrypoint: ["php", "artisan"]
    container_name: scheduler_prod
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: false
      DB_HOST: mysql
      REDIS_HOST: redis
    command: schedule:work
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  mysql:
    image: "mysql:8.4"
    container_name: mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    # No 'ports:' mapping here. It's completely invisible to the outside web.
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: "redis:7-alpine"
    container_name: redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    # No 'ports:' mapping here either.
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_prod_data:
  redis_prod_data:

networks:
  app_network:
    driver: bridge
